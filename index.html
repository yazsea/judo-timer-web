<script>
(function(){
  function setDiag(t){
    var d=document.getElementById("diagStatus");
    if(d){ d.innerHTML=t; }
  }
  window.__setJudoDiag=setDiag;
  window.onerror=function(msg,src,line,col){
    setDiag("b1.73 JS ERROR: "+msg+" @"+line+":"+col);
    return false;
  };
  window.onunhandledrejection=function(e){
    var r=e&&e.reason;
    setDiag("b1.73 PROMISE ERROR: "+(r&&r.message?r.message:String(r)));
  };
})();
</script>

<div id="app">

      <button class="whiteb" data-score="right,shido,-1">指-</button>
      <button class="whiteb" id="whiteOsaReset">リセット</button>
    </div>
    <div class="row row5">
      <button id="minPlus">Time分+</button>
      <button id="secPlus">Time秒+</button>
      <button class="green" id="matchBtn">スタート</button>
      <button id="gsBtn">GS</button>
      <button id="osaPlus">抑込秒+</button>
    </div>
    <div class="row row5">
      <button id="minMinus">Time分-</button>
      <button id="secMinus">Time秒-</button>
      <button class="reset" id="matchReset">リセット</button>
      <button id="settingsBtn">設定</button>
      <button id="osaMinus">抑込秒-</button>
    </div>

  <div class="spacer" id="versionTag" aria-label="version"></div>
</div>

<dialog id="settingsDialog">
  <div class="setting"><label>試合タイマー 分</label>
    <div class="stepper"><button data-step="m,-1">−</button><div class="value" id="setM">4</div><button data-step="m,1">＋</button></div>
  </div>
  <div class="setting"><label>試合タイマー 秒</label>
    <div class="stepper"><button data-step="s,-1">−</button><div class="value" id="setS">0</div><button data-step="s,1">＋</button></div>
  </div>
  <div class="setting"><label>抑込 有効 秒数</label>
    <div class="stepper"><button data-step="y,-1">−</button><div class="value" id="setY">5</div><button data-step="y,1">＋</button></div>
  </div>
  <div class="setting"><label>抑込 技あり 秒数</label>
    <div class="stepper"><button data-step="w,-1">−</button><div class="value" id="setW">10</div><button data-step="w,1">＋</button></div>
  </div>
  <div class="actions"><button class="green" id="saveSettings">保存</button><button id="cancelSettings">キャンセル</button></div>
</dialog>

<script>
const APP_VERSION="b1.73";
const STATE_SCHEMA=1;
const STORAGE_KEY="judo-timer-web-state-b1";
const STORAGE_BACKUP_KEY="judo-timer-web-state-b1-backup";
const DEFAULT_MATCH=240, DEFAULT_YUKO=5, DEFAULT_WAZA=10;
const S={
  players:{left:{yuko:0,waza:0,shido:0},right:{yuko:0,waza:0,shido:0}},
  matchSetting:DEFAULT_MATCH, matchLeft:DEFAULT_MATCH, matchRunning:false,
  matchStartedOnce:false, osaManualAdjusted:false,
  golden:false, gsNotice:false, last:performance.now(), matchAnchor:null,
  osaRunning:false, osaSide:"left", osaTime:0, osaStarted:null,
  osaBest:{left:0,right:0}, yukoSec:DEFAULT_YUKO, wazaSec:DEFAULT_WAZA,
};
const $=id=>document.getElementById(id);



let saveTimer=null;
let lastSavedState="";
function normalizedSnapshot(){
  const snapshot=JSON.parse(JSON.stringify(S));
  snapshot.matchRunning=false;
  // 再読み込み時は計時を止めるが、押さえ込み選択状態は保持する。
  snapshot.osaRunning=!!S.osaRunning;
  snapshot.osaStarted=null;
  delete snapshot.last;
  delete snapshot.matchAnchor;
  return snapshot;
}
function saveState(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer=null;
  }
  try{
    const snapshot=normalizedSnapshot();
    const stateJson=JSON.stringify(snapshot);
    // 状態が変わっていない定期保存ではlocalStorageを書き換えない。
    if(stateJson===lastSavedState) return;
    const next=JSON.stringify({
      schema:STATE_SCHEMA,
      appVersion:APP_VERSION,
      savedAt:Date.now(),
      state:snapshot
    });
    const current=localStorage.getItem(STORAGE_KEY);
    // 主保存が正常なJSONなら、上書き前に直前状態をバックアップする。
    if(current){
      try{
        const parsed=JSON.parse(current);
        const source=(parsed && parsed.state) ? parsed.state : parsed;
        if(sanitizeState(source)) localStorage.setItem(STORAGE_BACKUP_KEY,current);
      }catch(_e){}
    }
    localStorage.setItem(STORAGE_KEY,next);
    lastSavedState=stateJson;
  }catch(_e){}
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    saveTimer=null;
    saveState();
  },120);
}
function sanitizeState(v){
  if(!v || typeof v!=="object") return null;
  const cleanPlayer=p=>({
    yuko:clamp(Math.trunc(Number(p && p.yuko)||0),0,9),
    waza:clamp(Math.trunc(Number(p && p.waza)||0),0,1),
    shido:clamp(Math.trunc(Number(p && p.shido)||0),0,2)
  });
  const side=v.osaSide==="right"?"right":"left";
  const matchSetting=clamp(Number(v.matchSetting)||DEFAULT_MATCH,0,599);
  const yukoSec=clamp(Number(v.yukoSec)||DEFAULT_YUKO,1,18);
  let wazaSec=clamp(Number(v.wazaSec)||DEFAULT_WAZA,2,19);
  if(wazaSec<=yukoSec) wazaSec=Math.min(19,yukoSec+1);

  return {
    players:{left:cleanPlayer(v.players && v.players.left),right:cleanPlayer(v.players && v.players.right)},
    matchSetting, matchLeft:clamp(Number(v.matchLeft)||0,0,599), matchRunning:false,
    golden:!!v.golden, gsNotice:!!v.gsNotice, last:performance.now(),
    osaRunning:!!v.osaRunning, osaSide:side, osaTime:clamp(Number(v.osaTime)||0,0,20), osaStarted:null,
    osaBest:{
      left:clamp(Number(v.osaBest && v.osaBest.left)||0,0,20),
      right:clamp(Number(v.osaBest && v.osaBest.right)||0,0,20)
    },
    yukoSec,wazaSec
  };
}
function restoreState(){
  const tryRestore=raw=>{
    if(!raw) return false;
    try{
      const parsed=JSON.parse(raw);
      // b1.03以前の保存形式も読み込めるよう後方互換を維持する。
      const source=(parsed && parsed.state) ? parsed.state : parsed;
      const clean=sanitizeState(source);
      if(!clean) return false;
      Object.assign(S,clean);
      S.matchAnchor=null;
      guardRuntimeState();
      lastSavedState=JSON.stringify(normalizedSnapshot());
      return true;
    }catch(_e){ return false; }
  };
  try{
    if(tryRestore(localStorage.getItem(STORAGE_KEY))) return;
    // 主保存が破損している場合は、直前の正常バックアップから自動復旧する。
    if(tryRestore(localStorage.getItem(STORAGE_BACKUP_KEY))) saveState();
  }catch(_e){}
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function guardRuntimeState(){
  let changed=false;
  const finite=(v,fallback)=>Number.isFinite(v)?v:fallback;
  const fixInt=(obj,key,min,max)=>{
    const next=clamp(Math.trunc(finite(Number(obj[key]),min)),min,max);
    if(obj[key]!==next){ obj[key]=next; changed=true; }
  };

  for(const side of ["left","right"]){
    const p=S.players[side] || (S.players[side]={yuko:0,waza:0,shido:0});
    fixInt(p,"yuko",0,9);
    fixInt(p,"waza",0,1);
    fixInt(p,"shido",0,2);
  }

  if(S.osaSide!=="left" && S.osaSide!=="right"){ S.osaSide="left"; changed=true; }

  const setting=clamp(finite(Number(S.matchSetting),DEFAULT_MATCH),0,599);
  if(S.matchSetting!==setting){ S.matchSetting=setting; changed=true; }

  let match=finite(Number(S.matchLeft),S.golden?0:S.matchSetting);
  match=S.golden?Math.max(0,match):clamp(match,0,599);
  if(S.matchLeft!==match){ S.matchLeft=match; changed=true; }

  const osa=clamp(finite(Number(S.osaTime),0),0,20);
  if(S.osaTime!==osa){ S.osaTime=osa; changed=true; }

  for(const side of ["left","right"]){
    const best=clamp(finite(Number(S.osaBest && S.osaBest[side]),0),0,20);
    if(!S.osaBest) S.osaBest={left:0,right:0};
    if(S.osaBest[side]!==best){ S.osaBest[side]=best; changed=true; }
  }

  const y=clamp(Math.trunc(finite(Number(S.yukoSec),DEFAULT_YUKO)),1,18);
  let w=clamp(Math.trunc(finite(Number(S.wazaSec),DEFAULT_WAZA)),2,19);
  if(w<=y) w=Math.min(19,y+1);
  if(S.yukoSec!==y){ S.yukoSec=y; changed=true; }
  if(S.wazaSec!==w){ S.wazaSec=w; changed=true; }

  if(S.matchAnchor!==null && !Number.isFinite(S.matchAnchor)){ S.matchAnchor=null; changed=true; }
  if(S.osaStarted!==null && !Number.isFinite(S.osaStarted)){ S.osaStarted=null; changed=true; }

  S.matchRunning=!!S.matchRunning;
  S.golden=!!S.golden;
  S.gsNotice=!!S.gsNotice;
  S.osaRunning=!!S.osaRunning;
  return changed;
}
function haptic(ms=12){
  try{ if('vibrate' in navigator) navigator.vibrate(ms); }catch(_e){}
}

function isStandaloneDisplay(){
  try{
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone===true;
  }catch(_e){ return false; }
}
async function enterRefereeDisplay(){
  // PWA起動時は既にアプリ表示なので、余計なFullscreen要求は行わない。
  if(!isStandaloneDisplay() && !document.fullscreenElement){
    try{ if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }catch(_e){}
  }
  // 対応端末では縦向きを固定。未対応環境では何もしない。
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("portrait-primary"); }catch(_e){}
}

function tryInitialFullscreen(){
  // ブラウザによってはユーザー操作なしのFullscreen要求が拒否される。
  // 起動直後に一度試し、失敗時は画面タップで再試行する。
  try{
    if(!isStandaloneDisplay() && !document.fullscreenElement && document.documentElement.requestFullscreen){
      var p=document.documentElement.requestFullscreen();
      if(p && typeof p.catch==="function") p.catch(function(){});
    }
  }catch(_e){}
}

function isTapInsideControlPanel(target){
  var panel=$("controlPanel");
  if(!panel || !target) return false;
  return panel===target || panel.contains(target);
}

function fullscreenFallbackFromTap(e){
  if(isSettingsOpen()) return;
  if(isStandaloneDisplay() || document.fullscreenElement) return;
  if(isTapInsideControlPanel(e.target)) return;
  enterRefereeDisplay();
}

function score(side,kind,d){
  if(isSettingsOpen()) return;
  haptic(8);
  const p=S.players[side];
  const key=kind==="yuko"?"yuko":kind==="waza"?"waza":kind==="shido"?"shido":null;
  if(!key) return;
  const max=key==="yuko"?9:key==="waza"?1:2;
  const next=clamp(p[key]+d,0,max);
  if(next===p[key]) return;
p[key]=next;
  scheduleSave(); render();
}
function award(side,t){
  const p=S.players[side];
  if(p.waza===0 && t>=S.wazaSec && t<20){
p.waza=1;
  }else if(t>=S.yukoSec && t<S.wazaSec && p.yuko<9){
p.yuko=clamp(p.yuko+1,0,9);
  }
}
function startOsa(side){
  if(!S.matchRunning) return;

  var previousSide=(side==="left")?"right":"left";

  // 反対側が動作中なら、その時点の秒数で得点判定してから0へ戻す。
  if(S.osaRunning && S.osaSide===previousSide){
    var now=performance.now()/1000;
    if(S.osaStarted!==null){
      S.osaTime=Math.max(0,now-S.osaStarted);
      S.osaBest[previousSide]=Math.max(S.osaBest[previousSide],S.osaTime);
    }
    stopOsa(previousSide,true);
    S.osaBest[previousSide]=0;
    S.osaTime=0;
    S.osaStarted=null;
  }

  // 反対側が一時停止中なら、残っている秒数で得点判定してから0へ戻す。
  if(!S.osaRunning && S.osaBest[previousSide]>0){
    var pausedTime=S.osaBest[previousSide];
    award(previousSide,pausedTime);
    S.osaBest[previousSide]=0;
    S.osaTime=0;
    S.osaStarted=null;
  }

  // 新しい側は0秒から開始。
  S.osaBest[side]=0;
  S.osaSide=side;
  S.osaTime=0;
  S.osaRunning=true;
  S.osaStarted=performance.now()/1000;
  scheduleSave();
  render();
}
function stopOsa(side=S.osaSide,doAward=true){
  if(!S.osaRunning || S.osaSide!==side) return;
  if(S.osaStarted!==null) S.osaTime=Math.max(0,performance.now()/1000-S.osaStarted);
  S.osaRunning=false; S.osaBest[side]=Math.max(S.osaBest[side],S.osaTime); S.osaStarted=null;
  if(doAward) award(side,S.osaTime); scheduleSave(); render();
}
function toggleOsa(side){
  if(isSettingsOpen()) return;
  haptic(12);
  S.osaRunning && S.osaSide===side ? stopOsa(side,true) : startOsa(side);
}
function resetOsa(side){
  if(isSettingsOpen() || S.osaRunning) return;

  // 赤/白どちらのリセットボタンでも、両方の抑込タイマーを0へ初期化する。
  // リセット操作では秒数判定による得点処理を行わない。
  S.osaRunning=false;
  S.osaStarted=null;
  S.osaTime=0;
  S.osaBest.left=0;
  S.osaBest.right=0;
  scheduleSave();
  render();
}
function startMatch(){
  var resumeAdjustedOsa=!!S.osaManualAdjusted;
  const now=performance.now();

  // 再始動時は抑込カウントを0へ戻す。
  if(S.matchStartedOnce){
    S.osaRunning=false;
    S.osaStarted=null;
    if(!S.osaManualAdjusted){
      S.osaTime=0;
      S.osaBest.left=0;
      S.osaBest.right=0;
    }
  }

  S.matchStartedOnce=true;
  S.osaManualAdjusted=false;
  S.matchRunning=true;
  if(resumeAdjustedOsa){
    S.osaRunning=true;
    S.osaStarted=performance.now()/1000-S.osaTime;
  }
  S.last=now;
  S.matchAnchor=S.golden ? now/1000-S.matchLeft : now/1000+S.matchLeft;
  updateWakeLock();
  scheduleSave(); render();
}
function stopMatch(){
  const now=performance.now()/1000;
  if(S.matchRunning && S.matchAnchor!==null){
    S.matchLeft=S.golden ? Math.max(0,now-S.matchAnchor) : Math.max(0,S.matchAnchor-now);
  }

  // 試合タイマー停止時、動作中の抑込タイマーも同時に停止する。
  if(S.osaRunning){
    if(S.osaStarted!==null){
      S.osaTime=Math.max(0,now-S.osaStarted);
      S.osaBest[S.osaSide]=Math.max(S.osaBest[S.osaSide],S.osaTime);
    }
    S.osaRunning=false;
    S.osaStarted=null;
  }

  S.matchRunning=false;
  S.matchAnchor=null;
  updateWakeLock();
  scheduleSave(); render();
}
function toggleMatch(){
  if(isSettingsOpen()) return;
  haptic(14);
  if(S.matchRunning){
    stopMatch();
  }else{
    startMatch();
    // スマホでは計時開始を最優先し、その後に全画面/縦固定を試行する。
    Promise.resolve().then(()=>enterRefereeDisplay()).catch(()=>{});
  }
}
function startGS(){
  if(S.matchRunning || S.golden || S.matchLeft>0.0001) return;
  // GSボタンではGS状態へ切り替えるだけで、試合タイマーは開始しない。
  S.golden=true;
  S.gsNotice=true;
  S.matchLeft=0;
  S.matchRunning=false;
  S.matchAnchor=null;
  updateWakeLock();
  scheduleSave();
  render();
}
function gsAction(){
  if(!canUseStoppedControls()) return;
  haptic(12);
  if(!S.golden){ if(S.matchLeft<=0.0001) startGS(); return; }
  S.gsNotice=!S.gsNotice; scheduleSave(); render();
}
function isSettingsOpen(){
  var d=$("settingsDialog"); return !!(d && d.open);
}
function canUseStoppedControls(){
  return !S.matchRunning && !isSettingsOpen();
}
function adjustMatch(sec){
  if(!canUseStoppedControls()) return;

  // Time分- は「分」だけを1減らし、秒表示は変更しない。
  // 例: 4:35→3:35→2:35→1:35→0:35。分が0ならそれ以上は減らさない。
  if(sec===-60){
    var whole=Math.floor(S.matchLeft);
    var minutes=Math.floor(whole/60);
    var seconds=whole%60;
    if(minutes<=0) return;
    S.matchLeft=(minutes-1)*60+seconds;
  }else{
    S.matchLeft=clamp(S.matchLeft+sec,0,599);
  }
  scheduleSave();
  render();
}
function adjustOsa(sec){
  if(!canUseStoppedControls() || !S.matchStartedOnce) return;
  S.osaTime=clamp(S.osaTime+sec,0,20); S.osaBest[S.osaSide]=S.osaTime;
  // 試合停止中の手動補正では、実時間計測を開始しない。
  if(S.osaRunning) S.osaStarted=null;
  S.osaManualAdjusted=true; scheduleSave(); render();
}
function resetMatchToDefault(){
  // 試合タイマーまたは抑込タイマー作動中は、試合タイマーリセットを無効化。
  if(S.matchRunning || S.osaRunning) return;

  // リセット長押し：試合状態・設定・全カウンターを初期値へ戻す。
  S.matchRunning=false;
  S.golden=false;
  S.gsNotice=false;
  S.matchSetting=DEFAULT_MATCH;
  S.matchLeft=DEFAULT_MATCH;
  S.matchStartedOnce=false; S.osaManualAdjusted=false;
  S.matchAnchor=null;
  S.last=performance.now();

  S.players.left.yuko=0;
  S.players.left.waza=0;
  S.players.left.shido=0;
  S.players.right.yuko=0;
  S.players.right.waza=0;
  S.players.right.shido=0;

  S.osaRunning=false;
  S.osaSide="left";
  S.osaTime=0;
  S.osaStarted=null;
  S.osaBest.left=0;
  S.osaBest.right=0;

  S.yukoSec=DEFAULT_YUKO;
  S.wazaSec=DEFAULT_WAZA;

  updateWakeLock();
  scheduleSave();
  render();
}

let wakeLock=null;
function freezeForHidden(){
  if(document.hidden){
    // rAF停止中に試合/押さえ込みだけ実時間で進まないよう現在値を確定する。
    const now=performance.now()/1000;
    if(S.matchRunning && S.matchAnchor!==null){
      S.matchLeft=S.golden ? Math.max(0,now-S.matchAnchor) : Math.max(0,S.matchAnchor-now);
      S.matchAnchor=null;
    }
    if(S.osaRunning && S.osaStarted!==null){
      S.osaTime=Math.max(0,now-S.osaStarted);
      S.osaBest[S.osaSide]=Math.max(S.osaBest[S.osaSide],S.osaTime);
      S.osaStarted=null;
    }
    saveState();
  }
}
function resumeFromHidden(){
  const now=performance.now();
  S.last=now;
  if(S.matchRunning){
    S.matchAnchor=S.golden ? now/1000-S.matchLeft : now/1000+S.matchLeft;
  }
  if(S.matchRunning && S.osaRunning && S.osaStarted===null){
    S.osaStarted=now/1000-S.osaTime;
  }
  if(isSettingsOpen()){
    S.matchRunning=false;
    S.matchAnchor=null;
  }
  updateWakeLock();
  scheduleSave();
  render();
}
async function updateWakeLock(){
  try{
    if(S.matchRunning && !document.hidden && 'wakeLock' in navigator){
      if(!wakeLock){
        wakeLock=await navigator.wakeLock.request('screen');
        wakeLock.addEventListener("release",()=>{ wakeLock=null; },{once:true});
      }
    }else if(wakeLock){
      const current=wakeLock;
      wakeLock=null;
      await current.release();
    }
  }catch(_e){ wakeLock=null; }
}

function render(){
  if($("matchReset")) $("matchReset").disabled=!!(S.matchRunning || S.osaRunning);
  document.body.classList.toggle("osa-active",!!S.osaRunning);
  document.body.classList.toggle("osa-left",!!S.osaRunning && S.osaSide==="left");
  document.body.classList.toggle("osa-right",!!S.osaRunning && S.osaSide==="right");
  guardRuntimeState();
  // 通常試合は残り時間なので切り上げ表示。GSは経過時間なので切り捨て表示。
  // これにより4:00開始直後に3:59へ落ちる表示誤差を防ぐ。
  const rawTotal=S.golden ? Math.floor(S.matchLeft) : Math.ceil(S.matchLeft);
  const total=Math.max(0,Math.min(599,rawTotal));
  $("matchTime").textContent=`${Math.floor(total/60)}:${String(total%60).padStart(2,"0")}`;
  $("osaTime").textContent=String(Math.floor(clamp(S.osaTime,0,20))).padStart(2,"0");
  
  

  const paused=!S.matchRunning && S.matchLeft>0.0001 && S.matchLeft<S.matchSetting-0.0001;
  $("stateText").textContent=S.matchRunning?"開始":"待て";
  $("stateText").style.color=S.matchRunning?"var(--green)":(paused?"var(--yellow)":"var(--gray)");
  $("gsText").style.color=S.gsNotice?"var(--yellow)":"#45494C";

  for(const [pre,side] of [["l","left"],["r","right"]]){
    const p=S.players[side];
    $(pre+"w").textContent=p.waza; $(pre+"y").textContent=p.yuko;
    $(pre+"s1").classList.toggle("on",p.shido>=1); $(pre+"s2").classList.toggle("on",p.shido>=2);
  }

  $("redOsa").textContent=S.osaRunning&&S.osaSide==="left"?"×":"抑込";
  $("whiteOsa").textContent=S.osaRunning&&S.osaSide==="right"?"×":"抑込";
  $("redOsa").disabled=!S.matchRunning;
  $("whiteOsa").disabled=!S.matchRunning;
  $("redOsaReset").disabled=!!S.osaRunning;
  $("whiteOsaReset").disabled=!!S.osaRunning;
  $("redOsaReset").setAttribute("aria-disabled",String($("redOsaReset").disabled));
  $("whiteOsaReset").setAttribute("aria-disabled",String($("whiteOsaReset").disabled));
  $("matchBtn").textContent=S.matchRunning?"ストップ":"スタート";
  $("osaPlus").disabled=!!(S.matchRunning || !S.matchStartedOnce);
  $("osaMinus").disabled=!!(S.matchRunning || !S.matchStartedOnce);

  const modalOpen=isSettingsOpen();
  const competitionIds=[
    "matchBtn","matchReset","gsBtn",
    "redOsa","whiteOsa","redOsaReset","whiteOsaReset",
    "minPlus","secPlus","osaPlus","minMinus","secMinus","osaMinus"
  ];

  // 通常時のdisabled状態を毎回再計算する。
  $("matchReset").disabled=!!(S.matchRunning || S.osaRunning);
  $("redOsa").disabled=!S.matchRunning;
  $("whiteOsa").disabled=!S.matchRunning;
  $("redOsaReset").disabled=!!S.osaRunning;
  $("whiteOsaReset").disabled=!!S.osaRunning;
  $("osaPlus").disabled=!!(S.matchRunning || !S.matchStartedOnce);
  $("osaMinus").disabled=!!(S.matchRunning || !S.matchStartedOnce);

  if(modalOpen){
    competitionIds.forEach(function(id){
      var el=$(id);
      if(el) el.disabled=true;
    });
  }

  const stoppedOnly=["minPlus","secPlus","osaPlus","minMinus","secMinus","settingsBtn","osaMinus"];
  stoppedOnly.forEach(id=>{
    const el=$(id);
    var disabled=!canUseStoppedControls();
    if((id==="osaPlus" || id==="osaMinus") && !S.matchStartedOnce) disabled=true;
    el.disabled=disabled;
    el.setAttribute("aria-disabled",String(el.disabled));
  });
  const gsUsable=!S.matchRunning && (S.golden||S.matchLeft<=0.0001);
  $("gsBtn").disabled=!gsUsable; $("gsBtn").setAttribute("aria-disabled",String($("gsBtn").disabled)); $("gsBtn").textContent=S.golden?(S.gsNotice?"GS ON":"GS OFF"):"GS";
}
function loop(now){
  S.last=now;
  if(S.matchRunning){
    const nowSec=now/1000;
    if(S.matchAnchor===null){
      S.matchAnchor=S.golden ? nowSec-S.matchLeft : nowSec+S.matchLeft;
    }
    if(S.golden) S.matchLeft=Math.max(0,nowSec-S.matchAnchor);
    else{
      S.matchLeft=Math.max(0,S.matchAnchor-nowSec);
      if(S.matchLeft<=0){
        S.matchLeft=0;
        S.matchAnchor=null;
        if(S.osaRunning){
          if(S.osaStarted!==null){
            S.osaTime=Math.max(0,performance.now()/1000-S.osaStarted);
            S.osaBest[S.osaSide]=Math.max(S.osaBest[S.osaSide],S.osaTime);
          }
          S.osaRunning=false;
          S.osaStarted=null;
        }
        S.matchRunning=false;
        S.matchAnchor=null;
        updateWakeLock();
        scheduleSave();
      }
    }
  }
  if(S.osaRunning && S.osaStarted!==null){
    S.osaTime=Math.max(0,performance.now()/1000-S.osaStarted);
    S.osaBest[S.osaSide]=Math.max(S.osaBest[S.osaSide],S.osaTime);
    const limit=S.players[S.osaSide].waza===0?20:10;
    if(S.osaTime>=limit){
      S.osaTime=limit;
      if(S.golden && limit===20 && S.matchRunning){ S.matchRunning=false; S.matchAnchor=null; updateWakeLock(); }
      S.osaRunning=false; S.osaBest[S.osaSide]=Math.max(S.osaBest[S.osaSide],S.osaTime);
      S.osaStarted=null; award(S.osaSide,S.osaTime); scheduleSave();
    }
  }
  guardRuntimeState();
  render(); requestAnimationFrame(loop);
}

var secHoldTimer=null, secRepeatTimer=null, secHoldButton=null, secHoldPointerId=null, secSuppressClickUntil=0;

function stopSecRepeat(){
  if(secHoldTimer){ clearTimeout(secHoldTimer); secHoldTimer=null; }
  if(secRepeatTimer){ clearInterval(secRepeatTimer); secRepeatTimer=null; }
  if(secHoldButton && secHoldPointerId!==null){
    try{
      if(secHoldButton.hasPointerCapture && secHoldButton.hasPointerCapture(secHoldPointerId)){
        secHoldButton.releasePointerCapture(secHoldPointerId);
      }
    }catch(_e){}
  }
  secHoldButton=null;
  secHoldPointerId=null;
}

function beginSecRepeat(button,delta,e){
  if(!canUseStoppedControls() || button.disabled) return;
  stopSecRepeat();
  secHoldButton=button;
  secHoldPointerId=(e && e.pointerId!==undefined)?e.pointerId:null;
  try{
    if(secHoldPointerId!==null && button.setPointerCapture) button.setPointerCapture(secHoldPointerId);
  }catch(_e){}

  secHoldTimer=setTimeout(function(){
    secHoldTimer=null;
    secSuppressClickUntil=Date.now()+800;
    adjustMatch(delta);
    secRepeatTimer=setInterval(function(){
      if(!canUseStoppedControls() || button.disabled){
        stopSecRepeat();
        return;
      }
      adjustMatch(delta);
    },100);
  },600);
}

function bindSecRepeat(button,delta){
  button.addEventListener("pointerdown",function(e){
    if(e.isPrimary===false || (e.pointerType==="mouse" && e.button!==0)) return;
    beginSecRepeat(button,delta,e);
  });
  button.addEventListener("pointerup",function(){ stopSecRepeat(); });
  button.addEventListener("pointercancel",function(){ stopSecRepeat(); });
  button.addEventListener("lostpointercapture",function(){ stopSecRepeat(); });
  button.addEventListener("click",function(e){
    if(Date.now()<secSuppressClickUntil){
      e.preventDefault();
      e.stopImmediatePropagation();
      stopSecRepeat();
      return;
    }
    adjustMatch(delta);
  },true);
  button.addEventListener("contextmenu",function(e){ e.preventDefault(); });
}

bindSecRepeat($("secPlus"),1);
bindSecRepeat($("secMinus"),-1);
document.addEventListener("visibilitychange",function(){ if(document.hidden) stopSecRepeat(); });
window.addEventListener("blur",stopSecRepeat);

let resetTapCount=0;
let resetTapTimer=null;
function handleResetTripleTap(e){
  if(S.matchRunning || S.osaRunning || isSettingsOpen()) return;
  if(e && e.preventDefault) e.preventDefault();

  resetTapCount++;
  clearTimeout(resetTapTimer);

  if(resetTapCount>=3){
    resetTapCount=0;
    resetTapTimer=null;
    resetMatchToDefault();
    return;
  }

  resetTapTimer=setTimeout(function(){
    resetTapCount=0;
    resetTapTimer=null;
  },700);
}

document.querySelectorAll("[data-step]").forEach(function(b){
  var holdTimer=null;
  var repeatTimer=null;
  var activePointerId=null;
  var suppressClickUntil=0;

  function info(){
    var p=b.dataset.step.split(",");
    return {
      k:p[0],
      d:Number(p[1]),
      id:{m:"setM",s:"setS",y:"setY",w:"setW"}[p[0]],
      lim:{m:[0,9],s:[0,59],y:[1,18],w:[2,19]}[p[0]]
    };
  }

  function stepOnce(){
    var x=info();
    $(x.id).textContent=clamp(Number($(x.id).textContent)+x.d,x.lim[0],x.lim[1]);
  }

  function stopHold(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    if(repeatTimer){ clearInterval(repeatTimer); repeatTimer=null; }
    if(activePointerId!==null){
      try{
        if(b.hasPointerCapture && b.hasPointerCapture(activePointerId)) b.releasePointerCapture(activePointerId);
      }catch(_e){}
    }
    activePointerId=null;
  }

  // iPhone/Android共通: 設定画面の「試合タイマー 秒」だけ長押し連続。
  // その他の設定値は従来どおり1タップ1カウント。
  if(info().k==="s"){
    b.addEventListener("pointerdown",function(e){
      if(e.isPrimary===false || (e.pointerType==="mouse" && e.button!==0)) return;
      stopHold();
      activePointerId=(e.pointerId!==undefined)?e.pointerId:null;
      try{ if(activePointerId!==null && b.setPointerCapture) b.setPointerCapture(activePointerId); }catch(_e){}
      holdTimer=setTimeout(function(){
        holdTimer=null;
        suppressClickUntil=Date.now()+800;
        stepOnce();
        repeatTimer=setInterval(stepOnce,100);
      },600);
    });
    b.addEventListener("pointerup",stopHold);
    b.addEventListener("pointercancel",stopHold);
    b.addEventListener("lostpointercapture",stopHold);
    b.addEventListener("click",function(e){
      if(Date.now()<suppressClickUntil){
        e.preventDefault();
        e.stopImmediatePropagation();
        stopHold();
        return;
      }
      stepOnce();
    },true);
    b.addEventListener("contextmenu",function(e){e.preventDefault();});
  }else{
    b.addEventListener("click",function(e){
      if(e && e.isTrusted===false) return;
      stepOnce();
    });
  }

  document.addEventListener("visibilitychange",function(){ if(document.hidden) stopHold(); });
  window.addEventListener("blur",stopHold);
});
$("cancelSettings").addEventListener("click",function(){
  saveState();
  dlg.close();
  location.reload();
});
dlg.addEventListener("close",function(){render();});
$("saveSettings").addEventListener("click",function(){
  if(!dlg.open) return;
  const m=+$("setM").textContent,s=+$("setS").textContent,y=+$("setY").textContent,w=+$("setW").textContent;
  if(!(1<=y && y<w && w<20)){alert("抑秒数は「有効 < 技あり < 20秒」にしてください。");return}
  S.matchSetting=m*60+s;
  if(!S.matchRunning && !S.golden) S.matchLeft=S.matchSetting;
  S.yukoSec=y; S.wazaSec=w;
  saveState();
  dlg.close();
  location.reload();
});


function startupSelfCheck(){
  const requiredIds=[
    "matchTime","osaTime","osaLabel","stateText","gsText",
    "lw","ly","ls1","ls2","rw","ry","rs1","rs2",
    "redOsa","whiteOsa","redOsaReset","whiteOsaReset",
    "matchBtn","matchReset","gsBtn","settingsBtn","settingsDialog","versionTag"
  ];
  const missing=requiredIds.filter(id=>!$(id));
  const stateOk=!!(S.players && S.players.left) && !!(S.players && S.players.right) &&
                Number.isFinite(Number(S.matchLeft)) &&
                Number.isFinite(Number(S.osaTime));
  if(missing.length || !stateOk){
    S.matchRunning=false;
    S.osaRunning=false;
    S.matchAnchor=null;
    S.osaStarted=null;
    console.error("Judo Timer startup self-check failed",{missing,stateOk});
    return false;
  }
  return true;
}

/* b1.73 SH-M15 compatibility mode:
   PWA/Service Workerをこの版では使わず、既存登録とキャッシュを解除する。 */
(function(){
  try{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        for(var i=0;i<regs.length;i++){ try{ regs[i].unregister(); }catch(e){} }
      }).catch(function(){});
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(keys){
        for(var i=0;i<keys.length;i++){
          if(String(keys[i]).indexOf("judo-timer-web-")===0){
            caches.delete(keys[i]);
          }
        }
      }).catch(function(){});
    }
  }catch(e){}
})();
if(window.__setJudoDiag) window.__setJudoDiag("b1.73 JS OK");
document.addEventListener("click",function(e){

  if(t && t.tagName==="BUTTON" && window.__setJudoDiag){
    window.__setJudoDiag("b1.73 CLICK: "+(t.id||t.textContent||"button"));
  }
},true);
requestAnimationFrame(loop);
